<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SleepBTI - 睡眠状态类型测试</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #e0e0ff;
  }
  #gameContainer {
    width: 480px;
    max-width: 95vw;
    min-height: 600px;
    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(12px);
    border-radius: 24px;
    border: 1px solid rgba(255,255,255,0.1);
    padding: 32px 28px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    position: relative;
  }

  #startScreen {
    text-align: center;
    padding: 40px 0;
  }
  #startScreen h1 {
    font-size: 42px;
    font-weight: 800;
    background: linear-gradient(135deg, #f093fb, #f5576c, #4facfe);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 8px;
  }
  #startScreen .subtitle {
    font-size: 14px;
    color: rgba(255,255,255,0.5);
    letter-spacing: 4px;
    margin-bottom: 16px;
  }
  #startScreen .desc {
    font-size: 15px;
    color: rgba(255,255,255,0.7);
    line-height: 1.7;
    margin-bottom: 32px;
    padding: 0 12px;
  }
  .btn {
    padding: 14px 52px;
    border: none;
    border-radius: 40px;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s;
    background: linear-gradient(135deg, #f093fb, #f5576c);
    color: white;
    box-shadow: 0 6px 20px rgba(245,87,108,0.4);
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(245,87,108,0.5); }
  .btn:active { transform: translateY(0); }

  .btn-secondary {
    background: rgba(255,255,255,0.1);
    box-shadow: none;
    color: rgba(255,255,255,0.8);
  }
  .btn-secondary:hover {
    background: rgba(255,255,255,0.18);
  }

  #questionScreen { display: none; }
  .progress-bar-wrap {
    height: 4px;
    background: rgba(255,255,255,0.1);
    border-radius: 4px;
    margin-bottom: 20px;
    overflow: hidden;
  }
  .progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #f093fb, #f5576c);
    border-radius: 4px;
    transition: width 0.4s ease;
  }
  .question-number {
    font-size: 13px;
    color: rgba(255,255,255,0.4);
    margin-bottom: 16px;
  }
  .question-text {
    font-size: 19px;
    line-height: 1.6;
    font-weight: 600;
    margin-bottom: 28px;
    min-height: 70px;
  }
  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .option-btn {
    padding: 14px 18px;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 14px;
    background: rgba(255,255,255,0.05);
    color: #e0e0ff;
    font-size: 15px;
    cursor: pointer;
    transition: all 0.25s;
    text-align: left;
    line-height: 1.4;
  }
  .option-btn:hover {
    background: rgba(255,255,255,0.12);
    border-color: rgba(245,87,108,0.4);
    transform: translateX(4px);
  }
  .option-btn .option-label {
    display: inline-block;
    min-width: 26px;
    font-weight: 700;
    color: #f5576c;
  }

  #resultScreen { display: none; text-align: center; padding: 20px 0; }
  #resultScreen .result-icon {
    font-size: 56px;
    margin-bottom: 8px;
  }
  #resultScreen .result-title {
    font-size: 28px;
    font-weight: 800;
    margin-bottom: 4px;
  }
  #resultScreen .result-code {
    font-size: 14px;
    color: rgba(255,255,255,0.4);
    margin-bottom: 16px;
    letter-spacing: 2px;
  }
  #resultScreen .result-desc {
    font-size: 15px;
    color: rgba(255,255,255,0.75);
    line-height: 1.7;
    margin-bottom: 24px;
    padding: 0 8px;
  }
  .result-tags {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    margin-bottom: 24px;
  }
  .result-tag {
    padding: 4px 14px;
    background: rgba(255,255,255,0.08);
    border-radius: 20px;
    font-size: 13px;
    color: rgba(255,255,255,0.6);
    border: 1px solid rgba(255,255,255,0.08);
  }
  .result-actions {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .result-actions .btn { padding: 12px 36px; font-size: 15px; }
</style>
</head>
<body>
<div id="gameContainer">

  <div id="startScreen">
    <div style="font-size:48px;margin-bottom:8px;">&#127769;</div>
    <h1>SleepBTI</h1>
    <div class="subtitle">SLEEP BEHAVIOR TYPE INDICATOR</div>
    <div class="desc">
      你的睡眠是什么"人格"?<br>
      8道题 &middot; 2分钟 &middot; 测出你的睡眠状态类型<br>
      是「深夜灵感家」、「复仇性熬夜人」、<br>
      还是「早起卷王」?
    </div>
    <button class="btn" id="startBtn">开始测试 &#8594;</button>
    <div style="margin-top:14px;font-size:12px;color:rgba(255,255,255,0.3);">仅供娱乐 &middot; 无科学依据</div>
  </div>

  <div id="questionScreen">
    <div class="progress-bar-wrap">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="question-number" id="questionNumber"></div>
    <div class="question-text" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
  </div>

  <div id="resultScreen">
    <div class="result-icon" id="resultIcon"></div>
    <div class="result-title" id="resultTitle"></div>
    <div class="result-code" id="resultCode"></div>
    <div class="result-desc" id="resultDesc"></div>
    <div class="result-tags" id="resultTags"></div>
    <div class="result-actions">
      <button class="btn" id="retryBtn">再来一次 &#8635;</button>
      <button class="btn btn-secondary" id="homeBtn">返回首页</button>
    </div>
  </div>

</div>

<script>
(function() {
  'use strict';

  var QUESTIONS = [
    {
      q: '睡前 30 分钟，你通常在做什么？',
      options: ['刷手机/看视频，根本停不下来', '看书/听播客，渐渐进入状态', '还在办公/写东西，工作没做完']
    },
    {
      q: '闹钟响了之后，你的第一反应是？',
      options: ['立刻摁掉，再睡 5 分钟（结果睡了半小时）', '赖一会儿床，慢慢清醒', '秒起，甚至闹钟还没响就醒了']
    },
    {
      q: '你觉得自己理想的睡眠时长是？',
      options: ['少于 6 小时就够了，睡多了浪费', '7-8 小时，刚刚好', '最好能睡 9 小时以上']
    },
    {
      q: '深夜 12 点，你突然有了一个绝妙的想法，你会？',
      options: ['立刻爬起来记下来，不然明天肯定忘', '先睡，明天再说——如果还记得的话', '打开手机备忘录写下，然后继续刷半小时手机']
    },
    {
      q: '你的床伴/室友对你的睡眠评价最可能是？',
      options: ['你是睡死了还是晕过去了?', '睡相还行，就是呼吸声有点大', '你昨晚又翻来覆去到几点?']
    },
    {
      q: '周末没有安排，你会几点起床？',
      options: ['比平时还早，生物钟比闹钟还准时', '自然醒，大概 9-10 点', '醒来也不起，躺到中午甚至下午']
    },
    {
      q: '睡觉时你对环境的敏感程度是？',
      options: ['一点光/声音就醒，睡眠极浅', '还行，一般动静不影响', '雷打不动，睡死状态']
    },
    {
      q: '如果一辈子只能选一种睡眠模式，你选？',
      options: ['早睡早起，健康第一', '晚睡晚起，效率最高', '随意，困了就睡，饿了就吃']
    }
  ];

  var RESULTS = [
    {
      id: 'NIGHTOWL',
      icon: '\uD83E\uDD86',
      title: '深夜灵感家',
      code: 'NI - NIGHT OWL',
      desc: '你是典型的夜间生物。夜深人静时你的大脑才真正开始运转——创意、灵感、生产力在午夜达到巅峰。白天的你属于世界，深夜的你属于自己。',
      tags: ['\u71AC\u591C\u6210\u6027', '\u591C\u732B\u5B50', '\u7075\u611F\u578B', '\u8D8A\u665A\u8D8A\u7CBE\u795E'],
      match: function(s) { return s.Q0 === 0 && s.Q3 === 0 && s.Q6 === 2; }
    },
    {
      id: 'REVENGER',
      icon: '\uD83D\uDE24',
      title: '复仇性熬夜人',
      code: 'RN - REVENGE NIGHT',
      desc: '白天不属于我，只有夜晚才是我的——这句话是你的座右铭。白天被工作、社交、责任填满，到了晚上你报复性地不愿入睡。',
      tags: ['复仇性熬夜', '拖延入睡', '白天太忙', '倔强型'],
      match: function(s) { return s.Q0 === 0 && s.Q1 === 0 && s.Q4 === 2; }
    },
    {
      id: 'EARLYBIRD',
      icon: '\u2600\uFE0F',
      title: '早起卷王',
      code: 'EB - EARLY BIRD',
      desc: '你是那个朋友圈里每天六点打卡的人。早起的鸟儿有虫吃——你是整个团队早上第一个回消息的人。',
      tags: ['早起', '自律狂', '卷王', '晨型人'],
      match: function(s) { return s.Q1 === 2 && s.Q5 === 0 && s.Q7 === 0; }
    },
    {
      id: 'NATURALIST',
      icon: '\uD83C\uDF3F',
      title: '佛系睡眠家',
      code: 'NS - NATURAL SLEEPER',
      desc: '困了就睡，饿了就吃——你是睡眠界的自由主义者。不拘泥于几点睡几点起，身体会告诉你什么时候该休息。',
      tags: ['随性', '佛系\u6C14\u8D28', '睡眠自由', '心态好'],
      match: function(s) { return s.Q2 === 1 && s.Q7 === 2 && s.Q5 === 1; }
    },
    {
      id: 'LIGHTSLEEPER',
      icon: '\uD83D\uDC42',
      title: '浅眠雷达',
      code: 'LS - LIGHT SLEEPER',
      desc: '你的睡眠系统装了一个超高灵敏度雷达——一点光、一点声音都能把你唤醒。建议投资一个好眼罩和降噪耳机。',
      tags: ['\u6D45\u7720', '\u9AD8\u654F\u611F', '\u6613\u9192', '\u7761\u6E23'],
      match: function(s) { return s.Q6 === 0 && s.Q4 === 1 && s.Q1 === 1; }
    },
    {
      id: 'BEDHERMIT',
      icon: '\uD83D\uDECC',
      title: '床上钉子户',
      code: 'BH - BED HERMIT',
      desc: '你的床是全宇宙最舒适的地方。闹钟响后你可以在床上躺到天荒地老，周末更是能躺出新高度。',
      tags: ['赖床专业户', '起床困难症', '恋床癖', '周末躺平'],
      match: function(s) { return s.Q1 === 0 && s.Q5 === 2 && s.Q2 === 2; }
    },
    {
      id: 'PERFECTIONIST',
      icon: '\uD83D\uDCCB',
      title: '作息规划师',
      code: 'PS - PERFECTION SLEEPER',
      desc: '你的睡眠像一份Excel表格——精确、有计划、严格执行。几点睡几点起、睡多久，都有标准流程。',
      tags: ['\u81EA\u5F8B', '\u8BA1\u5212\u63A7', '\u8BB2\u7A76', '\u89C4\u5F8B\u4F5C\u606F'],
      match: function(s) { return s.Q0 === 1 && s.Q7 === 0 && s.Q2 === 1; }
    },
    {
      id: 'ENERGIZER',
      icon: '\u26A1',
      title: '短睡超人',
      code: 'ES - ENERGIZER SLEEPER',
      desc: '你是那种让很多人嫉妒的存在——睡 5-6 小时就能满血复活。别人靠咖啡续命，你靠基因。',
      tags: ['\u77ED\u7761\u4F53\u8D28', '\u7CBE\u529B\u5145\u6C9B', '\u6548\u7387\u9AD8', '\u7535\u91CF\u6EE1\u683C'],
      match: function(s) { return s.Q2 === 0 && s.Q6 === 2 && s.Q5 === 0; }
    },
    {
      id: 'MASTER',
      icon: '\uD83C\uDFC6',
      title: '睡眠大师',
      code: 'SM - SLEEP MASTER',
      desc: '你是睡眠界的六边形战士！入睡快、睡得沉、醒得自然、作息规律、从不失眠。你已经赢了 90% 的打工人。',
      tags: ['\u5165\u7761\u5FEB', '\u7761\u5F97\u9999', '\u4F5C\u606F\u7A33', '\u738B\u8005\u7EA7'],
      match: function(s) {
        var good = [s.Q6 === 2, s.Q1 === 2, s.Q4 === 1, s.Q7 === 0];
        var count = 0;
        for (var i = 0; i < good.length; i++) { if (good[i]) count++; }
        return count >= 3;
      }
    }
  ];

  var state = {
    currentQ: 0,
    answers: {},
    mode: 'start'
  };

  function getEl(id) { return document.getElementById(id); }

  function showStart() {
    state.mode = 'start';
    state.currentQ = 0;
    state.answers = {};
    getEl('startScreen').style.display = 'block';
    getEl('questionScreen').style.display = 'none';
    getEl('resultScreen').style.display = 'none';
  }

  function startTest() {
    state.mode = 'quiz';
    state.currentQ = 0;
    state.answers = {};
    getEl('startScreen').style.display = 'none';
    getEl('resultScreen').style.display = 'none';
    getEl('questionScreen').style.display = 'block';
    renderQuestion();
  }

  function renderQuestion() {
    var q = QUESTIONS[state.currentQ];
    var total = QUESTIONS.length;
    var answered = 0;
    for (var k in state.answers) { if (state.answers.hasOwnProperty(k)) answered++; }

    getEl('progressBar').style.width = ((answered / total) * 100) + '%';
    getEl('questionNumber').textContent = '\u95EE\u9898 ' + (state.currentQ + 1) + ' / ' + total;
    getEl('questionText').textContent = q.q;

    var container = getEl('optionsContainer');
    container.innerHTML = '';
    var labels = ['A', 'B', 'C'];
    for (var i = 0; i < q.options.length; i++) {
      (function(idx) {
        var btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerHTML = '<span class="option-label">' + labels[idx] + '.</span> ' + q.options[idx];
        btn.onclick = function() { selectAnswer(idx); };
        container.appendChild(btn);
      })(i);
    }
  }

  function selectAnswer(idx) {
    state.answers['Q' + state.currentQ] = idx;
    state.currentQ++;
    if (state.currentQ >= QUESTIONS.length) {
      showResult();
    } else {
      renderQuestion();
    }
  }

  function getResult() {
    for (var i = 0; i < RESULTS.length; i++) {
      if (RESULTS[i].match(state.answers)) return RESULTS[i];
    }
    return RESULTS[Math.floor(Math.random() * RESULTS.length)];
  }

  function showResult() {
    state.mode = 'result';
    getEl('questionScreen').style.display = 'none';

    var result = getResult();
    getEl('resultIcon').textContent = result.icon;
    getEl('resultTitle').textContent = result.title;
    getEl('resultCode').textContent = result.code;
    getEl('resultDesc').textContent = result.desc;

    var tagsContainer = getEl('resultTags');
    tagsContainer.innerHTML = '';
    for (var i = 0; i < result.tags.length; i++) {
      var span = document.createElement('span');
      span.className = 'result-tag';
      span.textContent = result.tags[i];
      tagsContainer.appendChild(span);
    }

    getEl('resultScreen').style.display = 'block';
  }

  // 绑定按钮 - 用 addEventListener 确保兼容
  document.addEventListener('DOMContentLoaded', function() {
    getEl('startBtn').addEventListener('click', startTest);
    getEl('retryBtn').addEventListener('click', startTest);
    getEl('homeBtn').addEventListener('click', showStart);
  });

  window.render_game_to_text = function() {
    var result = state.mode === 'result' ? getResult().id : null;
    var answered = 0;
    for (var k in state.answers) { if (state.answers.hasOwnProperty(k)) answered++; }
    return JSON.stringify({
      mode: state.mode,
      currentQ: state.currentQ,
      totalQ: QUESTIONS.length,
      answered: answered,
      result: result
    });
  };

  window.advanceTime = function(ms) {};

})();
</script>
</body>
</html></｜DSML｜container>
