<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SleepBTI - 睡眠状态类型测试</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #e0e0ff;
  }
  #gameContainer {
    width: 480px;
    max-width: 95vw;
    min-height: 600px;
    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(12px);
    border-radius: 24px;
    border: 1px solid rgba(255,255,255,0.1);
    padding: 32px 28px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    position: relative;
  }

  #startScreen {
    text-align: center;
    padding: 40px 0;
  }
  #startScreen h1 {
    font-size: 42px;
    font-weight: 800;
    background: linear-gradient(135deg, #f093fb, #f5576c, #4facfe);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 8px;
  }
  #startScreen .subtitle {
    font-size: 14px;
    color: rgba(255,255,255,0.5);
    letter-spacing: 4px;
    margin-bottom: 16px;
  }
  #startScreen .desc {
    font-size: 15px;
    color: rgba(255,255,255,0.7);
    line-height: 1.7;
    margin-bottom: 32px;
    padding: 0 12px;
  }
  .btn {
    padding: 14px 52px;
    border: none;
    border-radius: 40px;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s;
    background: linear-gradient(135deg, #f093fb, #f5576c);
    color: white;
    box-shadow: 0 6px 20px rgba(245,87,108,0.4);
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(245,87,108,0.5); }
  .btn:active { transform: translateY(0); }

  .btn-secondary {
    background: rgba(255,255,255,0.1);
    box-shadow: none;
    color: rgba(255,255,255,0.8);
  }
  .btn-secondary:hover {
    background: rgba(255,255,255,0.18);
  }

  #questionScreen { display: none; }
  .progress-bar-wrap {
    height: 4px;
    background: rgba(255,255,255,0.1);
    border-radius: 4px;
    margin-bottom: 20px;
    overflow: hidden;
  }
  .progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #f093fb, #f5576c);
    border-radius: 4px;
    transition: width 0.4s ease;
  }
  .question-number {
    font-size: 13px;
    color: rgba(255,255,255,0.4);
    margin-bottom: 16px;
  }
  .question-text {
    font-size: 19px;
    line-height: 1.6;
    font-weight: 600;
    margin-bottom: 28px;
    min-height: 70px;
  }
  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .option-btn {
    padding: 14px 18px;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 14px;
    background: rgba(255,255,255,0.05);
    color: #e0e0ff;
    font-size: 15px;
    cursor: pointer;
    transition: all 0.25s;
    text-align: left;
    line-height: 1.4;
  }
  .option-btn:hover {
    background: rgba(255,255,255,0.12);
    border-color: rgba(245,87,108,0.4);
    transform: translateX(4px);
  }
  .option-btn .option-label {
    display: inline-block;
    min-width: 26px;
    font-weight: 700;
    color: #f5576c;
  }

  #resultScreen { display: none; text-align: center; padding: 20px 0; }
  #resultScreen .result-icon {
    font-size: 56px;
    margin-bottom: 8px;
  }
  #resultScreen .result-title {
    font-size: 28px;
    font-weight: 800;
    margin-bottom: 4px;
  }
  #resultScreen .result-code {
    font-size: 14px;
    color: rgba(255,255,255,0.4);
    margin-bottom: 16px;
    letter-spacing: 2px;
  }
  #resultScreen .result-desc {
    font-size: 15px;
    color: rgba(255,255,255,0.75);
    line-height: 1.7;
    margin-bottom: 24px;
    padding: 0 8px;
  }
  .result-tags {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    margin-bottom: 24px;
  }
  .result-tag {
    padding: 4px 14px;
    background: rgba(255,255,255,0.08);
    border-radius: 20px;
    font-size: 13px;
    color: rgba(255,255,255,0.6);
    border: 1px solid rgba(255,255,255,0.08);
  }
  .result-actions {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .result-actions .btn { padding: 12px 36px; font-size: 15px; }
</style>
</head>
<body>
<div id="gameContainer">

  <div id="startScreen">
    <div style="font-size:48px;margin-bottom:8px;">&#127769;</div>
    <h1>SleepBTI</h1>
    <div class="subtitle">SLEEP BEHAVIOR TYPE INDICATOR</div>
    <div class="desc">
      你的睡眠是什么"人格"?<br>
      8道题 &middot; 2分钟 &middot; 测出你的睡眠状态类型<br>
      是「深夜灵感家」、「复仇性熬夜人」、<br>
      还是「早起卷王」?
    </div>
    <button class="btn" id="startBtn">开始测试 &#8594;</button>
    <div style="margin-top:14px;font-size:12px;color:rgba(255,255,255,0.3);">仅供娱乐 &middot; 无科学依据</div>
  </div>

  <div id="questionScreen">
    <div class="progress-bar-wrap">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="question-number" id="questionNumber"></div>
    <div class="question-text" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
  </div>

  <div id="resultScreen">
    <div class="result-icon" id="resultIcon"></div>
    <div class="result-title" id="resultTitle"></div>
    <div class="result-code" id="resultCode"></div>
    <div class="result-desc" id="resultDesc"></div>
    <div class="result-tags" id="resultTags"></div>
    <div class="result-actions">
      <button class="btn" id="retryBtn">再来一次 &#8635;</button>
      <button class="btn btn-secondary" id="homeBtn">返回首页</button>
    </div>
  </div>

</div>

<script>
(function() {
  'use strict';

  var QUESTIONS = [
    {
      q: '关灯躺下后，你的大脑第一个念头是？',
      options: ['刚才那个PPT第三页的字体是不是没对齐……', '明天早上吃什么，中午吃什么，晚上吃什么', '我好像忘了什么事……算了先睡']
    },
    {
      q: '半夜 3 点突然醒来，你的第一反应是？',
      options: ['打开手机刷短视频，越刷越精神', '翻个身继续睡，一气呵成', '焦虑地回想人生：我到底在干什么']
    },
    {
      q: '闹钟响了之后你一般会？',
      options: ['摁掉-再睡-摁掉-再睡-突然发现已经十点了', '赖五分钟，然后不情愿地爬起来', '闹钟还没响我就醒了，甚至已经跑了五公里']
    },
    {
      q: '你对“早睡早起”的真实态度是？',
      options: ['那是别人的生活方式，与我无关', '明天一定早睡——这句话我已经说了一千遍了', '早睡早起身体好，我每天都在践行']
    },
    {
      q: '你室友/对象的睡眠评价是？',
      options: ['你昨晚又说梦话了，好像在跟老板吵架', '睡得跟死了一样，地震都震不醒', '你翻来覆去一整晚，你到底什么做的']
    },
    {
      q: '周末早晨 7 点你醒了之后会？',
      options: ['闭眼继续睡，睡到下午才是对周末的尊重', '躺床上玩手机到中午，享受废物时光', '起床！周末是用来提升自己的！——然后打开了游戏']
    },
    {
      q: '如果睡眠之神给你一次修改机会，你选？',
      options: ['把一天改成48小时，5小时睡觉43小时摸鱼', '让我倒头就睡，不失眠不做梦不半夜醒', '取消闹钟这个东西，世界和平从取消闹钟开始']
    },
    {
      q: '睡前最后一件事，99%的情况下你在做？',
      options: ['刷社交媒体，看看有没有人给我点赞——没有，睡了', '检查闹钟是不是设好了，再检查一遍，再检查一遍', '闭上眼睛，开始在心里写明天的工作安排']
    },
    {
      q: '你觉得自己为什么睡不好？',
      options: ['工作太多/焦虑太多/脑子里有个永动机', '没有为什么，我就是天生睡得好气死你', '手机太好玩了，抖音和睡眠之间我选了前者']
    },
    {
      q: '对“睡眠是健康的基石”这句话你的理解是？',
      options: ['我选择死亡，不，我选择熬夜', '道理我都懂但我就是做不到', '没错，所以我每天早睡早起从不熬夜']
    }
  ];

  var RESULTS = [
    {
      id: 'REVENGER',
      icon: '\uD83D\uDE21',
      title: '复仇性熬夜选手',
      code: 'RN - REVENGE NIGHT',
      desc: '白天被老板PUA、被同事甩锅、被甲方的需求折磨，只有深夜才是属于你的时间。你不睡觉不是因为不困，是因为不甘心。你报复性地消耗自己的休息时间，像是对白天的一种无声抗议。建议：早点睡吧，身体是自己的，老板不会因为你猝死而感动。',
      tags: ['复仇性熬夜', '白天不属于我', '最后的倔强', '明天一定早睡'],
      match: function(s) { return s.Q0 === 1 && s.Q1 === 0 && s.Q6 === 0; }
    },
    {
      id: 'OVERTHINKER',
      icon: '\uD83E\uDD14',
      title: '午夜哲学家',
      code: 'OT - OVERTHINK NIGHT',
      desc: '你的大脑在深夜会自动开启人生复盘模式：五年前那句不该说的话、上周会议上没发挥好的表现、明天下班后该去哪儿吃饭……你的思维像永动机一样停不下来。最离谱的是，白天想不明白的事，你觉得半夜躺着就能想通——实际上什么都没想通，只是一夜没睡。',
      tags: ['胡思乱想', '人生复盘大师', '脑内小剧场', '深夜emo'],
      match: function(s) { return s.Q0 === 0 && s.Q1 === 2 && s.Q3 === 0; }
    },
    {
      id: 'SCROLLER',
      icon: '\uD83D\uDCF1',
      title: '刷屏深渊行者',
      code: 'SS - SCROLLING SLEEPER',
      desc: '你与手机的关系比任何一段人际关系都要亲密。睡前仪式是：躺下打开抖音/小红书/微博，两小时后——怎么又快两点了！你无数次告诉自己最后刷五分钟，但每次都是下一个五分钟后又是另一个五分钟。',
      tags: ['手机癌晚期', '再刷五分钟', '熬夜专业户', '屏幕时间冠军'],
      match: function(s) { return s.Q0 === 2 && s.Q1 === 0 && s.Q8 === 2; }
    },
    {
      id: 'EARLYBIRD',
      icon: '\u2600\uFE0F',
      title: '卷王本体',
      code: 'EB - EARLY BIRD',
      desc: '你就是那种让人又爱又恨的存在——早上六点发朋友圈早安打卡，八点已经完成了半天的工作。你的自律令人发指，但凌晨四点回邮件这事儿，能不能收敛一点？给同事们留点活路。',
      tags: ['早起卷王', '自律天花板', '晨型怪人', '六点打卡'],
      match: function(s) { return s.Q2 === 2 && s.Q3 === 2 && s.Q6 === 2; }
    },
    {
      id: 'BEDHERMIT',
      icon: '\uD83D\uDECC',
      title: '床上钉子户',
      code: 'BH - BED HERMIT',
      desc: '你的床是全宇宙最舒适的地方。闹钟响了？你可以躺到天荒地老。周末？你能躺出新高度。你的身体和床之间仿佛存在某种量子纠缠——强行分离会产生巨大的能量消耗。座右铭：能躺着绝不坐着，能坐着绝不站着。',
      tags: ['起床困难户', '恋床晚期', '床就是本体', '周末躺王'],
      match: function(s) { return s.Q2 === 0 && s.Q5 === 0 && s.Q7 === 0; }
    },
    {
      id: 'GOODBOY',
      icon: '\uD83D\uDCAA',
      title: '健康睡眠标兵',
      code: 'GS - GOOD SLEEPER',
      desc: '你是让人想打但又不得不佩服的存在——早睡早起、午休规律、从不失眠。但……你确定没有偷偷在半夜醒来过？如果你看到这里嘴角上扬了，恭喜你，你已经赢麻了。',
      tags: ['天选睡眠人', '早睡标兵', '作息模范', '高质量睡眠'],
      match: function(s) { return s.Q2 === 1 && s.Q3 === 2 && s.Q8 === 1; }
    },
    {
      id: 'ANXIOUS',
      icon: '\uD83D\uDE30',
      title: '深夜焦虑人',
      code: 'AX - ANXIOUS SLEEPER',
      desc: '你睡觉时像一只警觉的猫头鹰——一点声音就醒，一点光线就醒。你的睡眠系统装了一个超高灵敏度的雷达。半夜醒来后你常常陷入还能睡几个小时的计算中，越算越焦虑，越焦虑越睡不着。',
      tags: ['浅眠雷达', '高敏睡眠', '易醒体质', '睡眠焦虑'],
      match: function(s) { return s.Q4 === 2 && s.Q1 === 2 && s.Q8 === 0; }
    },
    {
      id: 'ENERGIZER',
      icon: '\u26A1',
      title: '短睡超人',
      code: 'ES - ENERGIZER SLEEPER',
      desc: '你让这世界上90%的人嫉妒——睡5小时就能满血复活，别人靠咖啡续命，你靠基因。凌晨两点睡、早上七点起还精神抖擞。电量再强也有用完的时候——虽然你可能觉得不需要。',
      tags: ['短睡体质', '人间充电宝', '基因赢家', '时间管理大师'],
      match: function(s) { return s.Q6 === 2 && s.Q5 === 2 && s.Q8 === 1; }
    },
    {
      id: 'MASTER',
      icon: '\uD83C\uDFC6',
      title: '睡眠之神',
      code: 'GOAT - SLEEP GOAT',
      desc: '等一下，你确定没在编？入睡快、睡得沉、从不失眠、作息规律……你是不是偷偷开了外挂？你是万里挑一的睡眠天才。请珍惜你的天赋，因为你的朋友们可能正在半夜三点睁着眼睛等你发消息。能力越大，责任越大。',
      tags: ['天选之子', '睡眠开挂', '人类巅峰', '作弊了吧'],
      match: function(s) {
        var good = [s.Q2 === 1, s.Q3 === 2, s.Q8 === 1, s.Q7 === 1];
        var cnt = 0;
        for (var i = 0; i < good.length; i++) { if (good[i]) cnt++; }
        return cnt >= 3;
      }
    },
    {
      id: 'DEADBED',
      icon: '\uD83D\uDE34',
      title: '睡死星人',
      code: 'DD - DEAD TO WORLD',
      desc: '打雷？听不见。地震？感觉不到。楼下装修？完全不知道。你属于睡死过去的人——字面意义上的。朋友叫你的方式已经不是喊名字，而是上手摇。他们甚至怀疑你有昏厥的毛病。但无所谓，反正你睡着了也不在乎。',
      tags: ['睡死体质', '雷打不动', '装死专业户', '地震叫不醒'],
      match: function(s) { return s.Q4 === 1 && s.Q5 === 0 && s.Q7 === 2; }
    }
  ];

  var state = {
    currentQ: 0,
    answers: {},
    mode: 'start'
  };

  function getEl(id) { return document.getElementById(id); }

  function showStart() {
    state.mode = 'start';
    state.currentQ = 0;
    state.answers = {};
    getEl('startScreen').style.display = 'block';
    getEl('questionScreen').style.display = 'none';
    getEl('resultScreen').style.display = 'none';
  }

  function startTest() {
    state.mode = 'quiz';
    state.currentQ = 0;
    state.answers = {};
    getEl('startScreen').style.display = 'none';
    getEl('resultScreen').style.display = 'none';
    getEl('questionScreen').style.display = 'block';
    renderQuestion();
  }

  function renderQuestion() {
    var q = QUESTIONS[state.currentQ];
    var total = QUESTIONS.length;
    var answered = 0;
    for (var k in state.answers) { if (state.answers.hasOwnProperty(k)) answered++; }

    getEl('progressBar').style.width = ((answered / total) * 100) + '%';
    getEl('questionNumber').textContent = '\u95EE\u9898 ' + (state.currentQ + 1) + ' / ' + total;
    getEl('questionText').textContent = q.q;

    var container = getEl('optionsContainer');
    container.innerHTML = '';
    var labels = ['A', 'B', 'C'];
    for (var i = 0; i < q.options.length; i++) {
      (function(idx) {
        var btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerHTML = '<span class="option-label">' + labels[idx] + '.</span> ' + q.options[idx];
        btn.onclick = function() { selectAnswer(idx); };
        container.appendChild(btn);
      })(i);
    }
  }

  function selectAnswer(idx) {
    state.answers['Q' + state.currentQ] = idx;
    state.currentQ++;
    if (state.currentQ >= QUESTIONS.length) {
      showResult();
    } else {
      renderQuestion();
    }
  }

  function getResult() {
    for (var i = 0; i < RESULTS.length; i++) {
      if (RESULTS[i].match(state.answers)) return RESULTS[i];
    }
    return RESULTS[Math.floor(Math.random() * RESULTS.length)];
  }

  function showResult() {
    state.mode = 'result';
    getEl('questionScreen').style.display = 'none';

    var result = getResult();
    getEl('resultIcon').textContent = result.icon;
    getEl('resultTitle').textContent = result.title;
    getEl('resultCode').textContent = result.code;
    getEl('resultDesc').textContent = result.desc;

    var tagsContainer = getEl('resultTags');
    tagsContainer.innerHTML = '';
    for (var i = 0; i < result.tags.length; i++) {
      var span = document.createElement('span');
      span.className = 'result-tag';
      span.textContent = result.tags[i];
      tagsContainer.appendChild(span);
    }

    getEl('resultScreen').style.display = 'block';
  }

  // 绑定按钮 - 用 addEventListener 确保兼容
  document.addEventListener('DOMContentLoaded', function() {
    getEl('startBtn').addEventListener('click', startTest);
    getEl('retryBtn').addEventListener('click', startTest);
    getEl('homeBtn').addEventListener('click', showStart);
  });

  window.render_game_to_text = function() {
    var result = state.mode === 'result' ? getResult().id : null;
    var answered = 0;
    for (var k in state.answers) { if (state.answers.hasOwnProperty(k)) answered++; }
    return JSON.stringify({
      mode: state.mode,
      currentQ: state.currentQ,
      totalQ: QUESTIONS.length,
      answered: answered,
      result: result
    });
  };

  window.advanceTime = function(ms) {};

})();
</script>
</body>
</html></｜DSML｜container>
